button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;letter-spacing:.3px}
header .logo{font-weight:800}
#engine-load{font-size:12px;color:var(--mut)}
.view{padding-bottom:84px;max-width:560px;margin:0 auto}
nav#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#111113;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#nav button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut)}
nav#nav button b{font-size:20px;line-height:1;font-weight:400}
nav#nav button.on{color:var(--tx)}
nav#nav button.on b{color:var(--acc)}
.pad{padding:12px 14px}.pad-x{padding:0 14px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16px}.card p{margin:6px 0}
.card.hl{border-color:var(--acc2);background:linear-gradient(160deg,#1f2a17,#1b1b1e)}
h2{margin:6px 0 4px;font-size:21px}
h3.sec{margin:18px 0 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.muted{color:var(--mut)}.small{font-size:12.5px}.center{text-align:center}.mt{margin-top:10px}
.big{font-size:26px;font-weight:800;line-height:1.1}
.pos{color:var(--acc)}.neg{color:var(--red)}.good{color:var(--acc)}.bad{color:#ff8a7a}
.row{display:flex;align-items:center}.between{justify-content:space-between}.around{justify-content:space-around}.gap{gap:8px;flex-wrap:wrap}.col{display:flex;flex-direction:column}.col.gap{gap:8px}
.btn{background:var(--acc);color:#fff;font-weight:700;border-radius:10px;padding:11px 16px;box-shadow:0 3px 0 var(--acc2);text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--acc2)}
.btn.ghost{background:#2a2a2e;box-shadow:0 3px 0 #18181a;color:var(--tx)}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:8px}
.btn.danger{color:#ff8a7a}
.hidden{display:none!important}
.seg{display:inline-flex;background:#232327;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;color:var(--mut)}
.seg button.on{background:#3a3a40;color:var(--tx);font-weight:600}
.seg.wide{display:flex}.seg.wide button{flex:1;padding:9px}
.seg.sm button{padding:4px 8px;font-size:12px}
.opt-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.tag{font-size:11px;background:#2d3b22;color:#b5e08a;border-radius:6px;padding:2px 6px;margin-left:6px}
.tag.rated{background:#3b2a22;color:#f2b08a}
.prov{font-size:14px;color:var(--mut);margin-left:2px}
/* bots */
.cat{margin:14px 0}.cat-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 6px}.cat-h h3{margin:0}
.bot{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.bot:active{background:#232327}
.av{width:42px;height:42px;flex:0 0 42px;border-radius:10px;background:#2a2a2e;display:flex;align-items:center;justify-content:center;font-size:24px}
.av.me{font-size:22px;background:#e9e9e9;color:#111}
.elo{color:var(--mut);font-size:13px}
input[type=range]{flex:1;accent-color:var(--acc)}
/* board */
.board-wrap{display:flex;gap:4px;padding:0 4px;margin:4px auto;max-width:min(100%,calc(100vh - 300px))}
@supports(height:100dvh){.board-wrap{max-width:min(100%,calc(100dvh - 300px))}}
.v-game .board-wrap{max-width:min(100%,calc(100vh - 330px))}
.board{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:4px;overflow:hidden}
.board .sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative}.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.crd{position:absolute;font-size:10px;font-weight:700;pointer-events:none}
.crd.rk{top:2px;left:3px}.crd.fl{bottom:1px;right:3px}
.sq.l .crd{color:var(--d)}.sq.d .crd{color:var(--l)}
.marks,.pcs,.badges{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;width:12.5%;height:12.5%;left:0;top:0}
.mk.last{background:var(--hl)}
.mk.sel{background:rgba(20,85,30,.5)}
.mk.check{background:radial-gradient(circle,rgba(255,0,0,.9) 0,rgba(231,0,0,.6) 30%,rgba(169,0,0,0) 72%)}
.mk.dot::after{content:"";position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.22)}
.mk.cap{box-shadow:inset 0 0 0 5px rgba(0,0,0,.22);border-radius:50%}
.mk.castle{box-shadow:inset 0 0 0 4px rgba(47,127,224,.55);border-radius:12%}
.mk.hint{background:rgba(47,127,224,.55)}
.mk.mark{background:rgba(232,194,28,.5)}
.mk.flash-bad{background:rgba(224,69,58,.6);animation:fl .7s forwards}
@keyframes fl{to{opacity:0}}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;background-size:cover;transition:transform .18s ease;will-change:transform}
.pc.dragging{transition:none;z-index:5}
.pc.fadein{animation:fi .2s}.pc.fadeout{opacity:0;transition:opacity .18s}
@keyframes fi{from{opacity:0}}
.board .arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.badge{position:absolute;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.5);z-index:6;animation:pop .25s}
@keyframes pop{from{transform:scale(0)}}
.c-brilliant{background:#1baca6}.c-great{background:#5c8bb0}.c-best{background:#81b64c}.c-excellent{background:#81b64c}.c-good{background:#95b776}.c-book{background:#a88865}.c-forced{background:#97a1ab}.c-inaccuracy{background:#f7c631}.c-mistake{background:#ffa459}.c-miss{background:#ff7769}.c-blunder{background:#fa412d}
.promo{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9}
.promo-box{display:flex;background:#eee;border-radius:10px;padding:6px;gap:4px}
.promo-box .pc{position:relative;width:64px;height:64px;transform:none!important;border-radius:8px;pointer-events:auto}
.promo-box .pc:active{background-color:#ccc}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.evalbar{position:relative;width:14px;flex:0 0 14px;background:#3a3a3a;border-radius:3px;overflow:hidden}
.evalfill{position:absolute;left:0;right:0;bottom:0;height:50%;background:#f0f0f0;transition:height .3s}
.evalbar.flip{transform:rotate(180deg)}
.evaltxt{position:absolute;left:0;right:0;bottom:2px;font-size:8px;text-align:center;color:#555;font-weight:700}
.evalbar.flip .evaltxt{transform:rotate(180deg);bottom:auto;top:2px}
/* game */
.game,.review,.lesson{padding-top:6px}
.pbar{display:flex;align-items:center;gap:10px;padding:6px 10px}
.pbar .av{width:36px;height:36px;flex-basis:36px;font-size:20px}
.pn{flex:1;min-width:0}
.caps{display:flex;align-items:center;min-height:16px;flex-wrap:wrap}
.pc.mini{position:relative;width:15px;height:15px;transform:none!important;margin-right:-4px;display:inline-block}
.adv{font-size:12px;color:var(--mut);margin-left:8px}
.think{font-size:12px;color:var(--mut);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.4}}
.clk{font-family:ui-monospace,Menlo,monospace;font-size:17px;background:#2a2a2e;border-radius:6px;padding:4px 8px;min-width:64px;text-align:center}
.clk.run{background:#e9e9e9;color:#111}.clk.low.run{background:#e0453a;color:#fff}
.coach{display:flex;gap:10px;margin:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.coach-av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:linear-gradient(135deg,#d97757,#b8573b);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.coach-body{flex:1;min-width:0}
.coach-text{font-size:14.5px}.coach-text p{margin:0 0 6px}
.coach-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.coach-btns:empty{display:none}
.chip{display:inline-block;color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:2px;vertical-align:1px}
.movelist{display:flex;gap:4px;overflow-x:auto;padding:6px 12px;white-space:nowrap;scrollbar-width:none;font-size:14px}
.movelist::-webkit-scrollbar{display:none}
.movelist.wrap{flex-wrap:wrap;white-space:normal}
.mn{color:var(--mut);margin-left:4px}
.mv{padding:2px 5px;border-radius:5px}
.mv i{font-style:normal;font-weight:800;margin-right:2px}
.review .mv{color:#fff}.review .mv i.dot{display:none}.mv i.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.mv.cur{background:#3a3a40}
.ctrls{display:flex;justify-content:space-around;margin:4px 8px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.ctrls button{flex:1;padding:8px 0;display:flex;flex-direction:column;align-items:center;font-size:18px}
.ctrls button span{font-size:11px;color:var(--mut)}
.nav-btns{display:flex;gap:6px;margin:6px 10px}
.nav-btns button{flex:1;background:#2a2a2e;border-radius:10px;padding:10px 0;font-size:15px}
.nav-btns #n-key{flex:2.2;font-size:13px;background:#3b2a22}
.rv-top{padding:6px 0}.acc{text-align:center;min-width:70px}
.graph{background:#1a1a1c;border-radius:8px;overflow:hidden;margin:4px 0}.graph .spark{height:56px}
.spark{width:100%;height:auto;display:block}
.cls-table{width:100%;border-collapse:collapse;margin:10px 0 20px}
.cls-table td,.cls-table th{text-align:center;padding:4px;font-size:14px}.cls-table th{color:var(--mut);font-weight:600}
.prog{height:6px;background:#2a2a2e;border-radius:3px;overflow:hidden;margin:8px 0}
.prog>div{height:100%;width:0;background:var(--acc);transition:width .2s}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:86vh;overflow:auto}
.modal.sheet{align-self:flex-end;max-height:78vh}
.modal .x{position:absolute;right:10px;top:8px;font-size:18px;color:var(--mut);padding:6px}
.modal h3{margin-top:0;padding-right:24px}
.end{text-align:center}.end h2{font-size:26px}.end.win h2{color:var(--acc)}.end.loss h2{color:#ff8a7a}
.end .stats{margin:14px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2f2f34;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:.25s;max-width:90vw;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.due{display:block}.an-lines{margin:6px 10px}.an-line{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:13.5px}.an-line .ev{display:inline-block;min-width:52px;color:var(--acc)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ai-out p,.ai-a p{margin:0 0 8px}
.ai-q{background:#2a2a2e;border-radius:10px;padding:6px 10px;margin:10px 0 6px;font-size:14px}
.ai-ask{display:flex;gap:6px;margin-top:10px}.ai-ask input{flex:1;min-width:0}
textarea.bk{width:100%;height:160px;font-size:11px}
/* home */
.stat-row{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.resume{display:flex;align-items:center;gap:12px}.resume>div{flex:1}
.task-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border-bottom:1px solid var(--line);text-align:left}
.task-row:last-of-type{border-bottom:0}
.task-row .ck{width:22px;height:22px;border-radius:50%;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 22px}
.task-row.done .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.task-row.done .tl{color:var(--mut)}
.tl{flex:1}.bar{display:block;height:4px;background:#2a2a2e;border-radius:2px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
details.road summary h3{display:inline}details.road summary::after{content:" ›";color:var(--mut)}
details.road p{margin:10px 0}
/* learn */
.op-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.op-l{flex:1}
.lvl{font-size:10.5px;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.lvl-Beginner{background:#2d3b22;color:#b5e08a}.lvl-Intermediate{background:#3b3522;color:#e8d08a}.lvl-Advanced{background:#3b2222;color:#f2a08a}
.ring{--p:0;width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#2a2a2e 0);display:flex;align-items:center;justify-content:center}
.ring span{background:var(--card);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.ideas{margin:0;padding-left:18px}.ideas li{margin:4px 0}
.line-card{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ltype{font-size:10.5px;border-radius:5px;padding:1px 6px;background:#2a2a2e;color:var(--mut)}
.t-main{background:#22303b;color:#8ac2f2}.t-trap{background:#3b2222;color:#f2a08a}
.stars{color:#f7c631;font-size:13px;letter-spacing:1px}
.back{color:var(--mut);padding:6px 0;font-size:14px}
.lvl-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.lvl-card h3{margin:0}
.les{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid var(--line)}
.les:last-child{border-bottom:0}.les span:nth-child(2){flex:1}
.les .ck{color:var(--mut)}.les.done .ck{color:var(--acc)}
.prose{font-size:15.5px}.prose p{margin:10px 0}
.task{font-weight:700}
.ls-title{font-size:19px}.ls-nav{margin:14px 0}
.sum{border-top:1px solid var(--line);margin-top:8px;padding-top:6px;color:#cfe3bb}
.pz-top{gap:8px;padding:4px 14px 8px}
.pz-top select{max-width:130px;font-size:13px}
.gm-row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.gm-row>span:nth-child(2){flex:1}
.res{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.rw{background:var(--acc)}.rl{background:#a33}.rd{background:#666}
.acc-s{color:var(--mut);font-size:13px}
label.row{margin:8px 0;gap:8px}
.lms{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:13.5px}
.lm{padding:2px 6px;border-radius:5px;background:#26262a;cursor:pointer}.lm.cur{background:var(--acc);color:#fff}
.modal.lp{padding:14px 10px;max-height:92vh}.lp-board{width:min(100%,46vh);margin:0 auto}
.lp-cap{margin:8px 4px;min-height:70px}
.nav-btns .lp-play{flex:2;font-size:13px;background:#22303b}
@media (min-width:600px){.board-wrap{max-width:560px}}
</style>
</head>
<body data-theme="green">
<header><h1><span class="logo">♞ Noir Chess</span> <span class="muted" id="title" style="font-weight:400;font-size:14px"></span></h1><span id="engine-load"></span></header>
<main class="view" id="view"></main>
<nav id="nav">
  <button data-v="home"><b>⌂</b>Home</button>
  <button data-v="play"><b>♟</b>Play</button>
  <button data-v="puzzles"><b>✦</b>Puzzles</button>
  <button data-v="learn"><b>❖</b>Learn</button>
  <button data-v="profile"><b>☺</b>Profile</button>
</nav>
<script src="app.js"></script>
<script>try{if('serviceWorker' in navigator&&window.top===window&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}</script>
</body>
</html>
