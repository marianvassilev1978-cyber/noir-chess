<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Noir Chess">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Personal chess trainer: 28 bots from 100 to 3200, six coaches, game review, puzzles, openings, endgames.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<title>Noir Chess</title>
<link rel="stylesheet" href="app.css?v=__V__">
<style>
#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(60% 40% at 50% 42%,#2a2214 0,#0b0b0d 70%);color:#f4f1ea;z-index:500;transition:opacity .45s ease}
#splash .mk{animation:spIn .9s cubic-bezier(.3,1.4,.5,1) both;filter:drop-shadow(0 10px 30px rgba(226,180,94,.25))}
#splash .wm{font-family:"Instrument Serif",Georgia,serif;font-size:34px;letter-spacing:.5px;animation:spTx .8s .25s cubic-bezier(.2,.8,.2,1) both}
#splash .wm i{color:#f4d58e}
@keyframes spIn{from{opacity:0;transform:scale(.6) translateY(10px)}}
@keyframes spTx{from{opacity:0;transform:translateY(12px);filter:blur(6px)}}
</style>
</head>
<body>
<div id="splash"><div class="mk">__LOGO__</div><div class="wm">Noir <i>Chess</i></div></div>
<div id="app"></div>
<script src="app.js?v=__V__"></script>
</body>
</html>
